[tools]
go = "1.26.0"
fzf = "0.74.4"

# ------------------------------------------------------------------------------
# Default / Meta Targets
# ------------------------------------------------------------------------------

[tasks.default]
alias = "all"
description = "Default workflow: verify version, lint, test, and build"
depends = ["version:verify", "lint", "test", "build"]

# ------------------------------------------------------------------------------
# Code Quality & Verification Targets
# ------------------------------------------------------------------------------

[tasks.fmt]
description = "Format Go source code with gofmt"
run = "go fmt ./..."

[tasks."fmt:check"]
description = "Check Go source code formatting"
run = "test -z \"$(gofmt -l .)\""

[tasks.vet]
description = "Run go vet code analysis"
run = "go vet ./..."

[tasks.lint]
description = "Verify code formatting and run static analysis"
depends = ["fmt:check", "vet"]

[tasks."version:verify"]
description = "Verify semantic version and prevent downgrades"
run = "./scripts/verify-version.sh"

# ------------------------------------------------------------------------------
# Testing Targets
# ------------------------------------------------------------------------------

[tasks.test]
description = "Run Go unit test suite with race detector"
run = "go test -v -race ./..."

# ------------------------------------------------------------------------------
# Build & Clean Targets
# ------------------------------------------------------------------------------

[tasks.build]
description = "Build the qw binary with version ldflags"
run = """
VERSION_VAL="$(cat VERSION | tr -d '[:space:]')"
COMMIT_VAL="$(git rev-parse --short HEAD 2>/dev/null || echo dev)"
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
go build -ldflags "-X main.version=v${VERSION_VAL} -X main.commit=${COMMIT_VAL} -X main.date=${BUILD_DATE}" -o bin/qw ./cmd/qw
"""

[tasks.clean]
description = "Remove compiled binaries and distribution artifacts"
run = "rm -rf bin/ dist/"

# ------------------------------------------------------------------------------
# Installation Targets
# ------------------------------------------------------------------------------

[tasks.install]
description = "Interactively select and install a release artifact via fzf and mise"
run = "./scripts/install.sh"

[tasks."install:dev"]
description = "Build and link local development binary into mise and ~/.local/bin/qw"
depends = ["build"]
run = "./scripts/install.sh --dev"

# ------------------------------------------------------------------------------
# Release Management Targets
# ------------------------------------------------------------------------------

[tasks.release]
description = "Trigger manual release publication via GitHub Actions and watch progress"
run = """
gh workflow run release.yml -f force=true
RUN_ID=""
for i in {1..15}; do
  RUN_ID="$(gh run list --workflow=release.yml --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
  [ -n "$RUN_ID" ] && break
  sleep 1
done
if [ -n "$RUN_ID" ]; then
  gh run watch "$RUN_ID"
fi
"""
